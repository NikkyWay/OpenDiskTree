name: Feature request
description: Suggest a focused improvement to OpenDiskTree
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to explain the use case.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What disk-analysis or cleanup workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result you would expect, including any safety or privacy implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or alternative designs.
