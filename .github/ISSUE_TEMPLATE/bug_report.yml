name: Bug report
description: Report a reproducible OpenDiskTree problem
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and OpenDiskTree versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private paths and file names from attached exports.
          required: true
